<!doctype html>
<html><head><meta charset="utf-8"><title>NexusLabs UX Walkthrough</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter-400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/Inter-700.ttf);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#04060a}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Inter;-webkit-font-smoothing:antialiased}
#bg{position:absolute;left:-200px;top:-200px;width:2320px;height:1480px;transform-origin:1160px 740px;
  background:radial-gradient(1200px 900px at 50% 45%,#1a1d24 0%,#111318 55%,#0b0c10 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(60px)}
#g1{width:1100px;height:800px;background:radial-gradient(closest-side,rgba(120,140,170,.10),rgba(30,169,110,0))}
#g2{width:1000px;height:760px;background:radial-gradient(closest-side,rgba(120,140,170,.08),rgba(56,120,246,0))}
#g3{width:700px;height:520px;background:radial-gradient(closest-side,rgba(120,140,170,.06),rgba(52,211,153,0))}
#particles{position:absolute;inset:0}
.pt{position:absolute;border-radius:50%;background:#cbd5e1;display:none}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#shadow{position:absolute;left:96px;top:109px;width:1728px;height:862.2px;border-radius:14.4px;
  box-shadow:0 40px 110px rgba(0,0,0,.6),0 14px 40px rgba(0,0,0,.4)}
#win{position:absolute;left:96px;top:109px;width:1920px;height:958px;transform:scale(.9);transform-origin:0 0;
  border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.scene{position:absolute;inset:0;overflow:hidden;display:none;background:#fff}
.scene img.fr{position:absolute;left:0;top:-122px;width:1920px;height:1080px}
.hl{position:absolute;border-radius:8px;border:2px solid rgba(37,99,235,.75);background:rgba(37,99,235,.04);opacity:0}
.hl i{position:absolute;left:-2px;top:-26px;font-style:normal;font-size:13px;font-weight:600;color:#fff;background:#2563eb;padding:3px 8px;border-radius:5px;white-space:nowrap}
.hl.red{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.035);box-shadow:0 0 0 4px rgba(239,68,68,.08),0 0 34px rgba(239,68,68,.24)}
#sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.18) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%}
#cap{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);padding:11px 20px;border-radius:12px;background:rgba(6,10,12,.74);
  border:1px solid rgba(255,255,255,.08);color:#eef2f1;font-size:21px;font-weight:500;white-space:nowrap}
#chip{position:absolute;left:64px;bottom:60px;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:12px;background:rgba(6,10,12,.74);
  border:1px solid rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:18px}
.logo{border-radius:9px;background:linear-gradient(135deg,#22b573,#1a8f5c);display:flex;align-items:center;justify-content:center}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#end .lg{display:flex;align-items:center;gap:20px}
#end .lg span{font-weight:700;font-size:62px;color:#fff;letter-spacing:-.01em}
#end .tag{margin-top:30px;font-size:27px;color:#cfe3dc;font-weight:500;letter-spacing:.01em}
#end .tag b{color:#34d399;font-weight:600}
#cursor{position:absolute;left:0;top:0;width:0;height:0}
#ripple{position:absolute;border-radius:50%;border:2px solid rgba(37,99,235,.7)}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18) 100%)}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div class="glow" id="g1"></div><div class="glow" id="g2"></div><div class="glow" id="g3"></div><div id="particles"></div></div>
  <div id="cam"><div id="shadow"></div><div id="win"><div id="scenes"></div><div id="sheen"></div><div id="ripple"></div>
<div id="cursor"><svg width="22" height="32" viewBox="0 0 22 32" style="position:absolute;left:-2px;top:-2px"><path d="M2 2 L2 25 L7.6 19.6 L11.6 28.6 L15.4 27 L11.5 18.2 L19 18.2 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div></div>
  <div id="chip"><span id="chipT"></span></div>
  <div id="cap"></div>
  <div id="end"><div class="lg"><span style="font-size:44px;font-weight:600">NexusLabs Research</span></div><div class="tag" style="font-size:22px;color:#9aa3b2">Website structure walkthrough &nbsp;·&nbsp; Internal UX documentation</div><div class="tag" style="font-size:16px;color:#6b7280;margin-top:16px">Captured from the live site, October 2026</div></div>
  <div id="vignette"></div><div id="fade"></div>
</div>
<script src="timeline.js"></script>
<script>
const DUR=TL.DUR,$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const ease5=t=>{t=clamp(t);return t*t*t*(t*(t*6-15)+10)};
const eOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const bell=(t,a,p,b)=>t<a||t>b?0:(t<p?ease((t-a)/(p-a)):1-ease((t-p)/(b-p)));
const win=(t,a,b,f=.3)=>seg(t,a,a+f)*(1-seg(t,b-f,b));
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const Y=y=>y-122;

// ---------- build scenes: each has its own frame image + highlight boxes
const SCN={};
TL.SCENES.forEach(sc=>{
  if(SCN[sc.id])return;
  const d=document.createElement('div');d.className='scene';d.id=sc.id;
  const im=document.createElement('img');im.className='fr';d.appendChild(im);
  $('scenes').appendChild(d);SCN[sc.id]={el:d,img:im,cur:'',hls:[]};
});
TL.HL.forEach(h=>{const b=document.createElement('div');b.className='hl'+(h.red?' red':'');
  Object.assign(b.style,{left:h.r[0]+'px',top:Y(h.r[1])+'px',width:(h.r[2]-h.r[0])+'px',height:(h.r[3]-h.r[1])+'px'});
  if(h.label){const l=document.createElement('i');l.textContent=h.label;b.appendChild(l);if(h.r[1]-122<30)l.style.top=(h.r[3]-h.r[1]+4)+'px';}
  SCN[h.scene].el.appendChild(b);h.el=b;});
const PTS=[];(function(){const box=$('particles');for(let i=0;i<80;i++){const e=document.createElement('div');e.className='pt';const s=.8+rnd()*1.8;
  Object.assign(e.style,{width:s+'px',height:s+'px'});box.appendChild(e);
  PTS.push({e,x:rnd()*2320,y:rnd()*1480,v:6+rnd()*14,a:.06+rnd()*.22,ph:rnd()*6.28,f:.4+rnd()*.9,dx:(rnd()-.5)*8});}})();

function interp(keys,t){if(t<=keys[0][0])return keys[0][1];for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];
  if(t<=b[0])return lerp(a[1],b[1],(t-a[0])/(b[0]-a[0]));}return keys[keys.length-1][1];}
function cam(t){const C=TL.CAM;let i=0;while(i<C.length-2&&t>C[i+1][0])i++;const a=C[i],b=C[i+1];const k=ease5(seg(t,a[0],b[0]));
  let z=lerp(a[1],b[1],k),fx=lerp(a[2],b[2],k),fy=lerp(a[3],b[3],k);const hh=600/z,hw=1066.7/z;
  if(z>1.26)fy=clamp(fy,122+hh,1080-hh);if(z>1.12)fx=clamp(fx,hw,1920-hw);return [z,fx,fy];}

async function render(t){
  $('fade').style.opacity=Math.max(1-seg(t,0,.5),seg(t,DUR-.6,DUR));
  const [z,fx,fy]=cam(t);const wx=96+.9*fx,wy=109+.9*Y(fy);
  $('cam').style.transform=`translate(${960-z*wx}px,${540-z*wy}px) scale(${z})`;
  $('bg').style.transform=`translate(${(960-wx)*(z-1)*.25}px,${(540-wy)*(z-1)*.25}px) scale(${1+(z-1)*.22})`;
  const g=(id,x,y)=>{$(id).style.transform=`translate(${x}px,${y}px)`};
  g('g1',150+Math.sin(t*.35)*90,40+Math.cos(t*.28)*60);g('g2',1250+Math.cos(t*.3)*80,700+Math.sin(t*.25)*60);g('g3',900+Math.sin(t*.22+1)*120,180+Math.cos(t*.31)*50);
  PTS.forEach(p=>{const y=((p.y-p.v*t)%1480+1480)%1480;p.e.style.transform=`translate(${p.x+Math.sin(t*.5+p.ph)*p.dx}px,${y}px)`;p.e.style.opacity=p.a*(.55+.45*Math.sin(t*p.f*2+p.ph))});
  // scenes: opacity + which source frame to show
  const op={},loads=[];
  TL.SCENES.forEach(sc=>{const o=Math.min(seg(t,sc.a,sc.a+sc.x),1-seg(t,sc.b,sc.b+sc.x));if(o<=0)return;
    if(o>(op[sc.id]?.o||0)){op[sc.id]={o,sc};}});
  Object.keys(SCN).forEach(id=>{const S=SCN[id],v=op[id];
    if(!v){S.el.style.display='none';return;}
    S.el.style.display='block';S.el.style.opacity=ease(v.o);const dy=v.sc.dy||0;const kin=seg(t,v.sc.a,v.sc.a+v.sc.x);S.el.style.transform=dy?`translateY(${(1-ease(kin))*dy}px)`:'none';
    const src=interp(v.sc.src,t);const seg_=v.sc.clip;const n=Math.max(1,Math.min(TL.CLIPS[seg_][1],1+Math.round((src-TL.CLIPS[seg_][0])*60)));
    const f=`${seg_}.jpg`;
    if(S.cur!==f){S.cur=f;S.img.src=f;loads.push(S.img.decode().catch(()=>{}));}
  });
  TL.HL.forEach(h=>{h.el.style.opacity=bell(t,h.t-.25,h.t+.2,h.t+(h.hold||1.4))});
  // chip + captions
  let chip='',co=0;TL.CHIPS.forEach(([a,b,txt])=>{const o=win(t,a,b,.35);if(o>co){co=o;chip=txt}});
  $('chipT').textContent=chip;$('chip').style.opacity=co;$('chip').style.transform=`translateY(${(1-co)*8}px)`;
  let cap='',cpo=0;TL.CAPS.forEach(([a,b,txt])=>{const o=win(t,a,b,.18);if(o>cpo){cpo=o;cap=txt}});
  $('cap').textContent=cap;$('cap').style.opacity=cpo;
  // sheen on the pull-back, end card
  const P=TL.S;
  $('sheen').style.opacity=bell(t,P.pull,P.pull+.6,P.pull+1.4)*.8;$('sheen').style.backgroundPosition=`${lerp(120,-20,ease(seg(t,P.pull,P.pull+1.4)))}% 0`;
  const endK=ease(seg(t,P.end,P.end+.8));
  $('cam').style.opacity=1-endK;$('cam').style.filter=endK>0.001?`blur(${endK*8}px)`:'none';$('end').style.opacity=endK;
  const lg=eOut(seg(t,P.end+.1,P.end+1.1));$('end').querySelector('.lg').style.transform=`translateY(${(1-lg)*14}px) scale(${.97+.03*lg})`;
  $('end').querySelectorAll('.tag').forEach((e,i)=>{e.style.opacity=eOut(seg(t,P.end+.5+i*.4,P.end+1.1+i*.4))});
  // cursor
  let pos=null;for(const m of TL.MOVES){if(t>=m[0]&&t<=m[1]){const k=ease(seg(t,m[0],m[1]));const p0=m[2],p2=m[3];const mx=(p0[0]+p2[0])/2,my=(p0[1]+p2[1])/2,dx=p2[0]-p0[0],dy=p2[1]-p0[1];const p1=[mx-dy*.12,my+dx*.12];
    pos=[(1-k)*(1-k)*p0[0]+2*(1-k)*k*p1[0]+k*k*p2[0],(1-k)*(1-k)*p0[1]+2*(1-k)*k*p1[1]+k*k*p2[1]];break;}}
  if(!pos){let last=TL.MOVES[0][2];for(const m of TL.MOVES){if(t>m[1])last=m[3];}pos=last;}
  let cop=0;TL.CVIS.forEach(([a,b])=>{cop=Math.max(cop,win(t,a,b,.25))});
  let pr=0;TL.CLICKS.forEach(c=>{pr=Math.max(pr,bell(t,c[2]-.05,c[2]+.02,c[2]+.14))});
  $('cursor').style.transform=`translate(${pos[0]}px,${Y(pos[1])}px) scale(${1-.12*pr})`;$('cursor').style.opacity=cop;
  let rv=0,rx=0,ry=0,rs=0;TL.CLICKS.forEach(([x,y,tc])=>{const k=seg(t,tc,tc+.5);if(k>0&&k<1){rv=(1-k)*.8;rx=x;ry=y;rs=8+28*eOut(k)}});
  Object.assign($('ripple').style,{opacity:rv,left:(rx-rs)+'px',top:(Y(ry)-rs)+'px',width:2*rs+'px',height:2*rs+'px'});
  await Promise.all(loads);
}
window.render=render;window.DUR=DUR;
</script>
</body></html>
